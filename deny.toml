# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# Exclude workspace members that need platform-specific tooling (GTK, NAPI,
# Tauri: the plugin and the RFC 027 benchmark app). These bring large
# transitive dependency trees with unmaintained crates and exotic licenses
# that are irrelevant to the core library. cargo-audit (security-audit.yml)
# still scans the whole Cargo.lock, so their advisories are not hidden.
[graph]
exclude = ["truffle-tauri-plugin", "truffle-napi", "truffle-bench-app"]

# Advisories — all advisories are denied by default in modern cargo-deny.
# Use `ignore` to suppress specific advisories with justification.
[advisories]
ignore = [
  # RUSTSEC-2026-0441 (2026-11): pin-utils 0.1.0 is UNMAINTAINED (its repository was archived on 2026-10-01), with no
  # vulnerability reported. It reaches truffle only through hyper 1.8.1 (Cargo.lock), and hyper 1.10.1 and later no
  # longer depend on it (the crates.io index, read 2026-11-06). Remove this entry when Cargo.lock's hyper moves to
  # >= 1.10.1: that bump touches the serve proxy's HTTP stack, so it is its own change, not this chore's.
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained, not vulnerable; only via hyper 1.8.1, and hyper >= 1.10.1 drops it" },
]

# Licenses — only explicitly allowed licenses pass; everything else is denied.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
