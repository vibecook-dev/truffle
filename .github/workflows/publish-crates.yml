name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable tag to publish (used to resume a draft release from main).
        required: false
        type: string

concurrency:
  group: crates-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    name: Publish crates
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC trusted publishing
      # GitHub intentionally hides draft release assets from read-only tokens.
      # Write access is required only so this job can download those assets;
      # the release remains draft until the orchestrator verifies all publishers.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # Recovery runs intentionally build package contents from the immutable
      # release tag while using automation from the exact workflow commit.
      # Keeping the second checkout isolated prevents control-plane fixes from
      # changing any source that cargo publishes.
      - name: Checkout release automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          sparse-checkout: scripts/crates-io-version-status.mjs
          sparse-checkout-cone-mode: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache-dependency-path: packages/sidecar-slim/go.sum

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin checksums for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG##*v}"
          mkdir -p /tmp/sidecar-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern 'tsnet-sidecar-*' \
            --dir /tmp/sidecar-assets
          node scripts/update-sidecar-checksums.mjs "${VERSION}" /tmp/sidecar-assets
          node scripts/check-release-versions.mjs

      - name: Build Go sidecar (needed for truffle-core compilation)
        working-directory: packages/sidecar-slim
        run: |
          go build -o sidecar-slim .

      - name: Export verified release version
        run: |
          # The preceding strict release check already proves every Cargo
          # manifest matches this JSON version. Read JSON instead of parsing a
          # release-please-annotated TOML line with shell tools.
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Publishing verified crate set ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Obtain a short-lived crates.io token via OIDC (trusted publishing)
      # No secrets needed — the token is exchanged from GitHub's OIDC provider.
      # Requires trusted publisher configured on crates.io for each crate.
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth

      # Publish in dependency order: truffle-core → truffle-sidecar → truffle
      - name: Publish truffle-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          CRATE_STATUS=$(node .release-automation/scripts/crates-io-version-status.mjs truffle-core "${VERSION}")
          case "$CRATE_STATUS" in
            published) echo "truffle-core ${VERSION} is already published; skipping." ;;
            missing) cargo publish --locked --package truffle-core ;;
            *) echo "::error::Unexpected sparse-index status: ${CRATE_STATUS}"; exit 1 ;;
          esac

      - name: Wait for truffle-core to reach the crates.io index
        run: node .release-automation/scripts/crates-io-version-status.mjs --wait truffle-core "${VERSION}"

      - name: Publish truffle-sidecar
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          CRATE_STATUS=$(node .release-automation/scripts/crates-io-version-status.mjs truffle-sidecar "${VERSION}")
          case "$CRATE_STATUS" in
            published) echo "truffle-sidecar ${VERSION} is already published; skipping." ;;
            missing) cargo publish --locked --package truffle-sidecar ;;
            *) echo "::error::Unexpected sparse-index status: ${CRATE_STATUS}"; exit 1 ;;
          esac

      - name: Wait for truffle-sidecar to reach the crates.io index
        run: node .release-automation/scripts/crates-io-version-status.mjs --wait truffle-sidecar "${VERSION}"

      - name: Publish truffle
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          CRATE_STATUS=$(node .release-automation/scripts/crates-io-version-status.mjs truffle "${VERSION}")
          case "$CRATE_STATUS" in
            published) echo "truffle ${VERSION} is already published; skipping." ;;
            missing) cargo publish --locked --package truffle ;;
            *) echo "::error::Unexpected sparse-index status: ${CRATE_STATUS}"; exit 1 ;;
          esac
