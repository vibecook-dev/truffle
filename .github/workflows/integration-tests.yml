name: Integration tests (real Tailscale)

# Runs the real-network integration suites against a live Tailscale tailnet.
# See docs/rfcs/020-ci-testing.md for the design.
#
# Skips gracefully if TRUFFLE_TEST_AUTHKEY is not set (e.g. PRs from forks),
# so this workflow stays green for contributors without access to the secret.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize on-branch runs so simultaneous pushes don't fight for tailnet
  # device slots. Different branches/PRs can still run in parallel.
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-network:
    name: cargo test -p truffle-core --tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      # GitHub automatically redacts this value from logs. Without the secret
      # (fork PRs), the tests print `[skip]` and pass.
      TRUFFLE_TEST_AUTHKEY: ${{ secrets.TRUFFLE_TEST_AUTHKEY }}
      TRUFFLE_TEST_LOG: "truffle_core=info"
      ALLOW_MISSING_AUTHKEY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          # Share cache with ci.yml's cargo-test job for faster runs.
          shared-key: cargo-test

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: packages/sidecar-slim/go.sum

      - name: Preflight — report skip-vs-run mode
        run: |
          if [ -n "${TRUFFLE_TEST_AUTHKEY:-}" ]; then
            echo "::notice::TRUFFLE_TEST_AUTHKEY is set — real-network tests WILL RUN."
          elif [ "${ALLOW_MISSING_AUTHKEY}" = "true" ]; then
            echo "::warning::TRUFFLE_TEST_AUTHKEY is not set (fork PR?) — all real-network tests will skip gracefully."
          else
            echo "::error::TRUFFLE_TEST_AUTHKEY is required for trusted PRs and main-branch runs."
            exit 1
          fi

      - name: Run real-network integration tests
        # --test-threads=1: each integration test spins up its own real tsnet
        # node pair; running them in parallel on shared GH runners causes
        # occasional convergence timeouts (documented flake). Serializing
        # within each test binary trades ~a minute of wall clock for green.
        run: cargo test --locked -p truffle-core --tests --verbose -- --nocapture --test-threads=1
