name: Release CLI Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload assets to. Defaults to the workflow ref name.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            cli_bin: truffle
            sidecar_bin: sidecar-slim
            archive: truffle-darwin-arm64.tar.gz
            archive_cmd: tar czf

          # macOS Intel
          - platform: darwin-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            cli_bin: truffle
            sidecar_bin: sidecar-slim
            archive: truffle-darwin-x64.tar.gz
            archive_cmd: tar czf

          # Linux x64 (musl — statically linked, works on any Linux distro)
          - platform: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            cli_bin: truffle
            sidecar_bin: sidecar-slim
            archive: truffle-linux-x64.tar.gz
            archive_cmd: tar czf

          # Linux ARM64 (cross-compiled, gnu — musl cross-compile needs extra tooling)
          - platform: linux-arm64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            cli_bin: truffle
            sidecar_bin: sidecar-slim
            archive: truffle-linux-arm64.tar.gz
            archive_cmd: tar czf
            cross: true

          # Windows x64
          - platform: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            cli_bin: truffle.exe
            sidecar_bin: sidecar-slim.exe
            archive: truffle-win32-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: packages/sidecar-slim/go.sum

      - name: Install musl toolchain (Linux x64)
        if: matrix.rust_target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Build Rust CLI
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --locked --release --package truffle-cli --target ${{ matrix.rust_target }}

      - name: Build Go sidecar
        working-directory: packages/sidecar-slim
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags "-s -w -X main.Version=${RELEASE_TAG}" \
            -o "${{ matrix.sidecar_bin }}" .

      - name: Verify sidecar Go toolchain
        working-directory: packages/sidecar-slim
        shell: bash
        run: go version -m "${{ matrix.sidecar_bin }}" | grep -F 'go1.26.8'

      - name: Prepare staging directory
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.cli_bin }}" staging/
          cp "packages/sidecar-slim/${{ matrix.sidecar_bin }}" staging/

      - name: Strip binaries (Unix)
        if: runner.os != 'Windows' && !matrix.cross
        run: |
          strip staging/${{ matrix.cli_bin }}

      - name: Strip binaries (Linux ARM64 cross)
        if: matrix.cross
        run: |
          aarch64-linux-gnu-strip staging/${{ matrix.cli_bin }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd staging
          chmod +x ${{ matrix.cli_bin }} ${{ matrix.sidecar_bin }}
          tar czf ../${{ matrix.archive }} ${{ matrix.cli_bin }} ${{ matrix.sidecar_bin }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd staging
          7z a ../${{ matrix.archive }} ${{ matrix.cli_bin }} ${{ matrix.sidecar_bin }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "${{ matrix.archive }}" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: truffle-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
