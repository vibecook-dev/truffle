name: Benchmarks (nightly + on-demand)

# Runs the RFC 027 benchmark suite (`truffle-bench suite --profile <p> --pair`)
# against a real Tailscale tailnet, plus the legacy `transport` TCP/QUIC runs,
# and uploads the JSON reports as artefacts. Triggered nightly on a cron and
# manually via the Actions UI. Reports import into the truffle bench app
# (History → Import reports accepts the downloaded artefact .zip).
#
# Both hubs of a pair run on one hosted runner, so every suite report has topology
# `same-process`: it measures the bridges and netstack, not a link. Numbers are
# *directional* (noisy neighbours, ±20-40%). A dedicated runner is a future
# option; see benchmark/README.md for methodology.

on:
  schedule:
    # Daily at 06:00 UTC (late evening Americas, early morning EU).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Suite profile (benchmark/README.md lists the contents)'
        type: choice
        required: false
        default: nightly
        options:
          - smoke
          - standard
          - full
          - nightly

permissions:
  contents: read

concurrency:
  # One benchmark run at a time — they share the CI tailnet's device pool.
  group: benchmarks
  cancel-in-progress: false

jobs:
  macro:
    name: Macro benchmark suite
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      TRUFFLE_TEST_AUTHKEY: ${{ secrets.TRUFFLE_TEST_AUTHKEY }}
      TRUFFLE_TEST_LOG: 'truffle_core=info'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Preflight — refuse to run without auth key
        run: |
          if [ -z "${TRUFFLE_TEST_AUTHKEY:-}" ]; then
            echo "::error::TRUFFLE_TEST_AUTHKEY is not set. Benchmarks require a real tailnet."
            echo "::error::Configure the secret at: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: cargo-test

      - name: Install Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: packages/sidecar-slim/go.sum

      - name: Validate tailnet credentials
        timeout-minutes: 3
        run: cargo test --locked -p truffle-core --test integration_eager_identity -- --nocapture

      - name: Build truffle-bench in release mode
        id: build
        run: cargo build --locked -p truffle-bench --release

      # Exits non-zero if any suite item is not `ok`; every item still writes
      # its own v3 report into target/bench-results/.
      - name: Benchmark suite (${{ inputs.profile || 'nightly' }})
        env:
          PROFILE: ${{ inputs.profile || 'nightly' }}
        run: cargo run --locked -p truffle-bench --release -- suite --profile "$PROFILE" --pair

      # Legacy schema-2 transport runs, byte-compatible with tsnet-bench. They
      # still run when a suite item failed, so the baseline is never lost.
      - name: Raw TCP and QUIC (legacy transport, same-host)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo run --locked -p truffle-bench --release -- transport --protocol tcp --bytes 1048576 --iterations 5 --warmup 1
          cargo run --locked -p truffle-bench --release -- transport --protocol quic --bytes 1048576 --iterations 5 --warmup 1 --concurrency 2

      - name: Summarise results
        if: always()
        run: |
          {
            echo "## Bench results"
            echo '```'
            found=0
            for f in target/bench-results/*.json; do
              [ -f "$f" ] || continue
              found=1
              if ! command -v jq >/dev/null 2>&1; then
                echo "── $(basename "$f") ──"
                cat "$f"
                echo ""
              elif jq -e '.schema_version == 3' "$f" >/dev/null 2>&1; then
                jq -r '
                  "\(.workload) \(.status) \(.label)",
                  (.summary[]? | "  \(.label): \(.value) \(.unit)"),
                  (if .error then "  error: \(.error)" else empty end)
                ' "$f"
              else
                echo "── $(basename "$f") ──"
                jq -r '
                  "workload: \(.workload)",
                  "git_sha:  \(.git_sha // "n/a")",
                  "params:   \(.params | tostring)",
                  "results:  \(.results | tostring)"
                ' "$f"
                echo ""
              fi
            done
            if [ "$found" = "0" ]; then
              echo "(no results written — all benches failed)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: bench-results-${{ github.run_id }}
          path: target/bench-results/
          retention-days: 30
          if-no-files-found: warn
