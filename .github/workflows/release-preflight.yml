name: Release source preflight

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact immutable tag being published.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require an exact release tag checkout
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)
          head_sha=$(git rev-parse HEAD)
          if [ -z "${tag_sha}" ] || [ "${head_sha}" != "${tag_sha}" ]; then
            echo "::error::Checkout ${head_sha} is not immutable tag ${RELEASE_TAG} (${tag_sha:-missing})."
            exit 1
          fi

          version=$(node -p "require('./packages/core/package.json').version")
          if [ "${RELEASE_TAG}" != "truffle-v${version}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${version}."
            exit 1
          fi

      - name: Verify generated locks and release versions
        run: |
          node scripts/sync-release-locks.mjs --check
          node scripts/check-release-versions.mjs --allow-missing-checksums
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
