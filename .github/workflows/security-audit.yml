name: Security Audit

on:
  # Scan dependency changes and Go code changes that can alter reachability.
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '**/go.mod'
      - '**/go.sum'
      - 'packages/sidecar-slim/**/*.go'
      - 'apple/patches/**'
      - 'apple/Vendor/libtailscale/REVISION'
      - 'scripts/check-go-security.sh'
      - '.github/workflows/security-audit.yml'
  # Scheduled weekly scan (catches new advisories against existing deps)
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerabilities (sidecar and patched Apple wrapper)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            packages/sidecar-slim/go.sum
            apple/Vendor/libtailscale/go.sum
      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan both production dependency graphs
        run: bash scripts/check-go-security.sh

  cargo-deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - uses: EmbarkStudios/cargo-deny-action@v2

  cargo-audit:
    name: cargo-audit (vulnerability DB)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit
