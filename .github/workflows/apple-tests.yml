name: apple-tests

on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'crates/truffle-core/tests/interop_fixtures.rs'
      - '.github/workflows/apple-tests.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'crates/truffle-core/tests/interop_fixtures.rs'
      - '.github/workflows/apple-tests.yml'

jobs:
  # Consumes the package exactly as a downstream project does: the root
  # manifest, resolving TailscaleKit from its published URL. A fresh checkout
  # has no apple/Vendor/TailscaleKit.xcframework (it is gitignored), so this
  # job doubles as the clean-checkout test — if the binary target's URL or
  # checksum is wrong, package resolution fails here rather than in someone
  # else's build. Deliberately no Go toolchain and no materializer: needing
  # either would mean the published package is not self-contained.
  swift-published:
    name: Swift package as published (macOS)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Confirm the vendored artifact is absent
        run: |
          if [ -d apple/Vendor/TailscaleKit.xcframework ]; then
            echo "::error::apple/Vendor/TailscaleKit.xcframework is present in a fresh checkout — this job no longer proves the published package resolves on its own."
            exit 1
          fi

      - name: Resolve from the published binary target
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build production runtime (iOS device)
        run: |
          xcodebuild -scheme TruffleTailscale \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO

      - name: Build production runtime (iOS Simulator)
        run: |
          xcodebuild -scheme TruffleTailscale \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  # The apple/ manifest is a compatibility shim for consumers still on a
  # relative-path dependency. It builds TailscaleKit from source, so it keeps
  # the Go toolchain and the materializer. Delete this job with the shim.
  swift:
    name: Swift package (macOS)
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Install recorded Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Materialize pinned TailscaleKit
        working-directory: apple
        run: DEVELOPER_DIR="$(xcode-select -p)" ./scripts/materialize-tailscalekit.sh

      - name: Build
        working-directory: apple
        run: swift build

      - name: Test
        working-directory: apple
        run: swift test

      # `swift build`/`swift test` above run for the macOS host, where
      # TailscaleKitBackend.swift is `#if os(iOS) && canImport(TailscaleKit)`
      # and compiles to nothing — and the example app links only
      # TruffleSwiftUI. Without these two steps the entire production runtime
      # (MeshNode.startTailscale and the TailscaleKit glue) is never compiled
      # by CI. Build both slices the XCFramework ships so device-only and
      # simulator-only breakage are each caught.
      - name: Build production runtime (iOS device)
        working-directory: apple
        run: |
          xcodebuild -scheme TruffleTailscale \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO

      - name: Build production runtime (iOS Simulator)
        working-directory: apple
        run: |
          xcodebuild -scheme TruffleTailscale \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

      - name: Build example app (iOS Simulator)
        working-directory: apple/Examples/MeshChatDemo
        run: |
          xcodebuild -project MeshChatDemo.xcodeproj -scheme MeshChatDemo \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  fixtures-rust:
    name: Interop fixtures (Rust side)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Cross-decode shared fixtures
        run: cargo test --locked -p truffle-core --test interop_fixtures
