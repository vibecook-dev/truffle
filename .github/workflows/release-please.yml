name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        continue-on-error: true
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Release Please occasionally leaves its fully generated branch behind
      # when GitHub rejects the final PR API call without an error message.
      # Recover only when that exact branch is ahead of main; release/tag
      # failures remain fatal instead of being mistaken for PR preparation.
      - name: Recover an orphaned release PR branch
        id: release-recovery
        if: ${{ steps.release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release-please--branches--${GITHUB_REF_NAME}--components--truffle"
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/branches/${branch}" \
            >/dev/null; then
            echo "::error::Release Please failed and did not leave a recoverable release branch."
            exit 1
          fi

          status=$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}" \
            --jq '.status')
          if [ "${status}" != "ahead" ]; then
            echo "::error::Release Please failed and ${branch} is ${status}, not safely ahead of ${GITHUB_REF_NAME}."
            exit 1
          fi

          pr_url=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -z "${pr_url}" ]; then
            title=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${branch}" \
              --jq '.commit.message | split("\n")[0]')
            for attempt in $(seq 1 12); do
              if pr_json=$(gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/pulls" \
                -f "base=${GITHUB_REF_NAME}" \
                -f "head=${branch}" \
                -f "title=${title}" \
                -f "body=Release Please generated this release branch; the workflow recovered the PR after its final GraphQL call failed." \
                2>"${RUNNER_TEMP}/release-pr-create-error"); then
                pr_url=$(jq -r '.html_url // empty' <<< "${pr_json}")
                pr_number=$(jq -r '.number // empty' <<< "${pr_json}")
              else
                cat "${RUNNER_TEMP}/release-pr-create-error" >&2
                pr_json=$(gh api \
                  --method GET \
                  "repos/${GITHUB_REPOSITORY}/pulls" \
                  -f "base=${GITHUB_REF_NAME}" \
                  -f "head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
                  -f "state=open")
                pr_url=$(jq -r '.[0].html_url // empty' <<< "${pr_json}")
                pr_number=$(jq -r '.[0].number // empty' <<< "${pr_json}")
              fi

              if [ -n "${pr_url}" ] && [ -n "${pr_number}" ]; then
                break
              fi
              echo "GitHub did not create the release PR (${attempt}/12); retrying in 10 seconds..."
              sleep 10
            done
            if [ -z "${pr_url}" ] || [ -z "${pr_number}" ]; then
              echo "::error::GitHub did not create the recovered release PR after 12 attempts."
              exit 1
            fi
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
              -f "labels[]=autorelease: pending" \
              >/dev/null
            echo "::warning::Recovered orphaned Release Please branch as ${pr_url}."
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "recovered=true" >> "${GITHUB_OUTPUT}"

      # Generic Release Please updaters cannot regenerate generated lockfiles.
      # Synchronize them on the bot PR, then explicitly dispatch validation
      # because pushes made with GITHUB_TOKEN do not trigger more workflows.
      - name: Resolve release PR branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release-recovery.outputs.recovered == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
          RECOVERED_BRANCH: ${{ steps.release-recovery.outputs.branch }}
        run: |
          branch="${RECOVERED_BRANCH}"
          if [ -z "${branch}" ]; then
            branch=$(jq -r '.headBranchName // .headRefName // .head.ref // empty' <<< "${RELEASE_PR_JSON}")
          fi
          if [ -z "${branch}" ]; then
            branch=$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${GITHUB_REF_NAME}" \
              --state open \
              --label "autorelease: pending" \
              --json headRefName,updatedAt \
              --jq 'map(select(.headRefName | startswith("release-please--"))) | sort_by(.updatedAt) | last | .headRefName // empty')
          fi
          if [ -z "${branch}" ]; then
            echo "::error::Release Please updated a PR but its branch could not be resolved."
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release PR
        if: ${{ steps.release-pr.outputs.branch != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0

      - name: Synchronize generated release locks
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          node scripts/sync-release-locks.mjs
          node scripts/sync-release-locks.mjs --check
          node scripts/check-release-versions.mjs --allow-missing-checksums

          if git diff --quiet -- Cargo.lock crates/truffle-napi/package-lock.json; then
            echo "Generated release locks are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/truffle-napi/package-lock.json
            git commit -m "chore(release): synchronize generated lockfiles"
            git push origin "HEAD:${RELEASE_BRANCH}"
          fi

      - name: Validate prepared release PR
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_BRANCH}"
          gh workflow run integration-tests.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_BRANCH}"
          gh workflow run codeql.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_BRANCH}"

      # Release Please creates a draft release and immutable tag. Nothing is
      # published until the exact tagged commit has passed its push workflows.
      - name: Require green release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          wait_for_push_workflow() {
            workflow_file="$1"
            workflow_label="$2"
            for attempt in $(seq 1 120); do
              run_json=$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow_file}" \
                --commit "${RELEASE_SHA}" \
                --event push \
                --limit 10 \
                --json databaseId,status,conclusion,url \
                --jq 'sort_by(.databaseId) | last // {}' 2>/dev/null || true)
              status=$(jq -r '.status // empty' <<< "${run_json}")
              conclusion=$(jq -r '.conclusion // empty' <<< "${run_json}")
              url=$(jq -r '.url // empty' <<< "${run_json}")
              if [ "${status}" = "completed" ] && [ "${conclusion}" = "success" ]; then
                echo "${workflow_label} passed: ${url}"
                return 0
              fi
              if [ "${status}" = "completed" ] && [ "${conclusion}" != "success" ]; then
                echo "::error::${workflow_label} failed for ${RELEASE_SHA}: ${url}"
                return 1
              fi
              echo "Waiting for ${workflow_label} on ${RELEASE_SHA} (${attempt}/120)..."
              sleep 10
            done
            echo "::error::Timed out waiting for ${workflow_label} on ${RELEASE_SHA}."
            return 1
          }

          wait_for_push_workflow ci.yml "CI"
          wait_for_push_workflow integration-tests.yml "Real-network integration"
          wait_for_push_workflow codeql.yml "CodeQL"

      # GITHUB_TOKEN-created releases do not trigger release events, so dispatch
      # every publisher explicitly and capture the new run IDs.
      - name: Dispatch release workflows
        id: release-runs
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          latest_run_id() {
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "$1" \
              --commit "${RELEASE_SHA}" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId \
              --jq 'map(.databaseId) | max // 0'
          }

          dispatch_and_capture() {
            workflow_file="$1"
            output_name="$2"
            previous=$(latest_run_id "${workflow_file}")
            gh workflow run "${workflow_file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${RELEASE_TAG}"
            for attempt in $(seq 1 60); do
              current=$(latest_run_id "${workflow_file}")
              if [ "${current}" -gt "${previous}" ]; then
                echo "${output_name}=${current}" >> "${GITHUB_OUTPUT}"
                return 0
              fi
              echo "Waiting for ${workflow_file} dispatch (${attempt}/60)..."
              sleep 5
            done
            echo "::error::Could not find the new ${workflow_file} run."
            return 1
          }

          echo "crates_before=$(latest_run_id publish-crates.yml)" >> "${GITHUB_OUTPUT}"
          echo "npm_before=$(latest_run_id release-npm.yml)" >> "${GITHUB_OUTPUT}"
          dispatch_and_capture release-cli.yml cli_run
          dispatch_and_capture release-sidecar.yml sidecar_run
          dispatch_and_capture napi-build.yml napi_run

      - name: Require successful binary and native builds
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_RUN: ${{ steps.release-runs.outputs.cli_run }}
          SIDECAR_RUN: ${{ steps.release-runs.outputs.sidecar_run }}
          NAPI_RUN: ${{ steps.release-runs.outputs.napi_run }}
        run: |
          gh run watch "${CLI_RUN}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run watch "${SIDECAR_RUN}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run watch "${NAPI_RUN}" --repo "${GITHUB_REPOSITORY}" --exit-status

      - name: Require successful package publication
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CRATES_BEFORE: ${{ steps.release-runs.outputs.crates_before }}
          NPM_BEFORE: ${{ steps.release-runs.outputs.npm_before }}
        run: |
          find_new_run() {
            workflow_file="$1"
            previous="$2"
            for attempt in $(seq 1 120); do
              current=$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow_file}" \
                --commit "${RELEASE_SHA}" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId \
                --jq 'map(.databaseId) | max // 0')
              if [ "${current}" -gt "${previous}" ]; then
                echo "${current}"
                return 0
              fi
              echo "Waiting for ${workflow_file} publisher dispatch (${attempt}/120)..." >&2
              sleep 5
            done
            return 1
          }

          crates_run=$(find_new_run publish-crates.yml "${CRATES_BEFORE}")
          npm_run=$(find_new_run release-npm.yml "${NPM_BEFORE}")
          gh run watch "${crates_run}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run watch "${npm_run}" --repo "${GITHUB_REPOSITORY}" --exit-status

      - name: Publish verified GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest

      # SwiftPM cannot parse `truffle-vX.Y.Z`, so the Swift package needs a
      # plain SemVer tag to be resolvable by version range rather than by bare
      # revision. It points at the same commit — one release, two tag names,
      # consistent with every artifact sharing one version.
      #
      # Deliberately the last step: creating it earlier would leave a
      # `vX.Y.Z` tag pointing at an unverified commit whenever a gate above
      # fails, and SwiftPM would happily resolve it. The tag exists only once
      # the release is fully verified and published.
      - name: Tag the Swift package with SemVer
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          semver_tag="v${RELEASE_TAG#truffle-v}"
          if [ "${semver_tag}" = "v${RELEASE_TAG}" ]; then
            echo "::error::Could not derive a SemVer tag from ${RELEASE_TAG}."
            exit 1
          fi

          # Branch on the exit status, not on whether output is empty: `gh api`
          # writes its error body to STDOUT on 404, so an absent tag yields
          # non-empty output. Reading that as "the tag exists" is what broke
          # 0.7.7 — the anti-clobber guard below fired against a 404 body and
          # refused to create a tag that did not exist.
          if existing=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${semver_tag}" \
            --jq '.object.sha' 2>/dev/null); then
            if [ "${existing}" = "${RELEASE_SHA}" ]; then
              echo "${semver_tag} already points at ${RELEASE_SHA}."
              exit 0
            fi
            # Never repoint an existing tag: SwiftPM consumers resolve it, and
            # Package.resolved pins the revision it used to name.
            echo "::error::${semver_tag} exists at ${existing}, expected ${RELEASE_SHA}."
            exit 1
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${semver_tag}" \
            -f "sha=${RELEASE_SHA}" >/dev/null
          echo "Tagged ${semver_tag} at ${RELEASE_SHA} for SwiftPM."
