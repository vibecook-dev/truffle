version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - rust
    groups:
      # The napi crates release as one family: napi-derive's expansion targets
      # its own napi and napi-derive-backend, so one bumped alone breaks the
      # truffle-napi build (#204).
      napi:
        patterns:
          - 'napi'
          - 'napi-*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  - package-ecosystem: gomod
    directories:
      - /packages/sidecar-slim
      - /apple/Vendor/libtailscale
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
